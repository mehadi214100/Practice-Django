{% extends "base.html" %}
{% load crispy_forms_tags %}

{% block content %}

<div class="container">
  <h1 class="text-center py-2 text-white bg-primary mt-4">Hackathon Registration</h1>

  <div class="mx-auto mb-4" style="width:50%">
        <form method="post" enctype="multipart/form-data">
            {% csrf_token %}
            {{form|crispy}}

            <button type="submit" class="btn btn-primary">Submit</button>
        </form>
    </div>
</div>

{% endblock content %}

{% load static %}
<!doctype html>
<html lang="en">
  <head>
    <!-- Required meta tags -->
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">

    <!-- Bootstrap CSS -->
     <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <link rel="stylesheet" href="{% static "css/style.css" %}">
    <title>My Blog Application</title>
  </head>
  <body>
    <div class="container-fluid bg-light">
        <nav class="navbar container  navbar-expand-lg navbar-light bg-light">
        <a class="navbar-brand" href="/">My Blog</a>
        <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="navbarSupportedContent">

            {% with request.resolver_match.url_name as url_name  %}

            <ul class="navbar-nav me-auto">
            <li class="nav-item ">
                <a class="nav-link {% if url_name == 'home' %} active {% endif %}" href="/">Home </a>
            </li>
            <li class="nav-item ">
                <a class="nav-link {% if url_name == 'about' %} active {% endif %}" href="{% url "about" %}">About Us </a>
            </li>


            <li class="nav-item ">
                <a class="nav-link {% if url_name == 'portfolio' %} active {% endif %} " href="{% url "portfolio" %}">Portfolio</a>
            </li>
            <li class="nav-item ">
                <a class="nav-link {% if url_name == 'forms' %} active {% endif %} " href="{% url "forms" %}">Forms</a>
            </li>
            
            <li class="nav-item ">
                <a class="nav-link {% if url_name == 'contactus' %} active {% endif %}" href="{% url "contactus" %}">Contact Us</a>
            </li>
            <li class="nav-item ">
                <a class="nav-link {% if url_name == 'viewinfo' %} active {% endif %}" href="{% url "viewinfo" %}">View Info</a>
            </li>
            </ul>
            {% endwith %}
            <form class="d-flex">
                <input class="form-control me-2" type="search" placeholder="Search" aria-label="Search">
                <button class="btn btn-outline-success me-2" type="submit">Search</button>

            </form>
            <a href="{% url "hackathon" %}" class="btn btn-primary">Registration Hackathon</a>
        </div>
        </nav>
    </div>
    
    {% block content %}
    
    {% endblock content %}

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM" crossorigin="anonymous"></script>
  </body>
</html>
